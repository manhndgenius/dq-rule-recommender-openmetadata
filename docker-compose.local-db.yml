services:
  postgres:
    image: postgres:16-alpine
    container_name: dq-rule-postgres-local
    restart: "no"
    env_file:
      - .env.postgres.local
    ports:
      - "5433:5432"
    volumes:
      - dq-rule-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  dq-rule-postgres-data:

